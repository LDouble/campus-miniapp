name: CI

on:
  pull_request:
  push:
    branches:
      - master

concurrency:
  group: miniapp-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint, typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: yarn

      - name: Enable Corepack
        run: corepack enable

      - name: Install smoke test tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes ripgrep

      - name: Install dependencies
        run: yarn install --frozen-lockfile --non-interactive

      - name: Run checks
        run: yarn ci:check
        env:
          TARO_APP_REVIEW_API_BASE_URL: https://review.weouc.com
          TARO_APP_PRODUCTION_API_BASE_URL: https://product.weouc.com
